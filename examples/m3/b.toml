schema_version = 1

[app]
id = "dev.avelin.m3.nimbus"
name = "Nimbus 升级样例 B"
version = "0.4.0"
entry = "bin/nimbus-b.exe"

[payload]
directory = "payload-b"

[install]
directory_name = "AvelinM3Nimbus"
