name: Windows Rust preview validation

on:
  push:
    branches: [main, master, 'codex/**']
    paths:
      - '.github/workflows/rust-windows.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'crates/**'
      - 'scripts/**'
      - 'tests/harness/**'
      - 'packaging/**'
      - 'examples/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'NOTICE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avelin-rust-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public source contents
        run: python scripts/check-public-source.py
      - name: Prepare stable MSVC toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain stable x86_64-pc-windows-msvc i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The offline license collector resolves workspace metadata, including
          # dependencies omitted by the selected build/test roots. Fetch the
          # complete locked graph before entering its offline-only phase.
          cargo +stable fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned portable NSIS migration compiler
        run: |
          $prepared = ./scripts/prepare-windows-ci.ps1 -OutputDirectory target/ci-nsis | ConvertFrom-Json
          if ($prepared.status -cne 'PASSED') { throw 'NSIS preparation did not pass.' }
          "AVELIN_NSIS_ROOT=$($prepared.nsis_root)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Rust kit and validate all lifecycle and interruption cases
        run: |
          $runDirectory = "target/rust-ci/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $privateDirectory = Join-Path $env:GITHUB_WORKSPACE 'target/rust-ci-private'
          $null = New-Item -ItemType Directory -Path $privateDirectory -ErrorAction Stop
          $privateLog = Join-Path $privateDirectory 'validation.log'
          $validationExitCode = 1
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -File './scripts/ci-rust-windows.ps1' `
              -OutputDirectory $runDirectory -NsisRoot $env:AVELIN_NSIS_ROOT `
              -RustToolchain stable -CargoTargetDirectory (Join-Path $env:GITHUB_WORKSPACE 'target') `
              *> $privateLog
            if ($null -ne $LASTEXITCODE) { $validationExitCode = $LASTEXITCODE }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $privateLog
          }
          "AVELIN_RUST_CI_EXIT=$validationExitCode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AVELIN_RUST_CI_REPORT=$runDirectory/summary.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($validationExitCode -eq 0) {
            Write-Output 'Rust preview build, packaging, 19 lifecycle cases and 6 interruption cases passed.'
          } else {
            Write-Output "Rust preview validation failed (exit code $validationExitCode). See the public summary for the failing command."
          }
          exit $validationExitCode
      - name: Prepare public validation summary
        if: always()
        run: |
          $public = [ordered]@{
            schema_version = 1
            status = 'FAILED'
            commit = '${{ github.sha }}'
            runner = 'windows-2025'
            engine = 'rust'
            lifecycle_case_count = 0
            interruption_case_count = 0
            migration_required = $true
            package_sha256 = $null
            failed_command = $null
            last_command = $null
            last_command_status = $null
            completed_commands = 0
            failure_category = 'preparation_or_invocation_failed'
          }
          if ($env:AVELIN_RUST_CI_REPORT -and (Test-Path -LiteralPath $env:AVELIN_RUST_CI_REPORT)) {
            $report = Get-Content -LiteralPath $env:AVELIN_RUST_CI_REPORT -Raw | ConvertFrom-Json
            if ($env:AVELIN_RUST_CI_EXIT -eq '0' -and $report.status -ceq 'PASSED') {
              $public.status = 'PASSED'
              $public.failure_category = $null
            } else {
              $public.failure_category = 'verification_failed_after_command'
            }
            if ($report.lifecycle) { $public.lifecycle_case_count = [int]$report.lifecycle.case_count }
            if ($report.interruption) { $public.interruption_case_count = [int]$report.interruption.case_count }
            if ($report.package -and $report.package.zip_sha256 -match '^[0-9a-f]{64}$') { $public.package_sha256 = $report.package.zip_sha256 }
            $public.completed_commands = @($report.commands | Where-Object { $_.status -ceq 'EXITED_ZERO' }).Count
            $last = @($report.commands | Select-Object -Last 1)
            if ($last.Count -eq 1 -and $last[0].name -match '^[a-z0-9-]+$') {
              $public.last_command = $last[0].name
              if ($last[0].status -cin @('STARTING', 'RUNNING', 'EXITED_ZERO', 'FAILED')) { $public.last_command_status = $last[0].status }
            }
            $failed = @($report.commands | Where-Object { $_.status -cne 'EXITED_ZERO' } | Select-Object -Last 1)
            if ($failed.Count -eq 1 -and $failed[0].name -match '^[a-z0-9-]+$') {
              $public.failed_command = $failed[0].name
              $public.failure_category = 'command_failed'
            }
          }
          $null = New-Item -ItemType Directory -Path target/rust-ci-public -Force
          $public | ConvertTo-Json | Set-Content -LiteralPath target/rust-ci-public/summary.json -Encoding utf8
          $public | ConvertTo-Json | Write-Output
          "## Rust preview validation`n`nStatus: $($public.status)`n`nLifecycle cases: $($public.lifecycle_case_count); interruption cases: $($public.interruption_case_count)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Preserve public validation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-rust-preview-summary
          path: target/rust-ci-public/summary.json
          if-no-files-found: warn
          retention-days: 7
      # Raw reports, installed fixtures, third-party metadata and local logs can
      # contain account paths and SIDs. Only the explicit public fields above
      # are uploaded; no GUI, performance, signing or OS qualification is claimed.
