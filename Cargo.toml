[workspace]
resolver = "2"
members = ["apps/avelin-cli", "apps/avelin-app", "crates/avelin-core", "crates/avelin-ui", "crates/avelin-engine"]
default-members = ["apps/avelin-cli", "apps/avelin-app", "crates/avelin-core", "crates/avelin-engine"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
semver = { version = "1.0", features = ["serde"] }
toml = "0.9"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
