[package]
license.workspace = true
name = "avelin-ui"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
avelin-core = { path = "../avelin-core" }
gpui-kit = "=0.6.1"
smol = "=2.0.2"
log = "0.4"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }

[[example]]
name = "ui-smoke"
path = "examples/ui-smoke.rs"
